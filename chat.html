<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人聊 - 实时在线聊天</title>
    <style>
        :root {
            --primary: #6366F1;
            --primary-hover: #4F46E5;
            --secondary: #F1F5F9;
            --accent: #10B981;
            --text: #1E293B;
            --text-light: #64748B;
            --bg: #F8FAFC;
            --white: #FFFFFF;
            --border: #E2E8F0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
 
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
 
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
 
        .container {
            width: 100%;
            max-width: 640px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }
 
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
 
        .header {
            background: var(--primary);
            color: var(--white);
            padding: 24px;
            text-align: center;
        }
 
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
 
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
 
        .content {
            padding: 32px 24px;
        }
 
        .form-group {
            margin-bottom: 20px;
        }
 
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }
 
        .input-wrapper {
            position: relative;
        }
 
        .input-wrapper input {
            width: 100%;
            padding: 14px 16px;
            padding-left: 44px;
            font-size: 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            transition: all 0.3s ease;
            outline: none;
        }
 
        .input-wrapper input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
 
        .input-wrapper .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-light);
        }
 
        .input-hint {
            font-size: 12px;
            color: var(--text-light);
            margin-top: 6px;
        }
 
        .btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            color: var(--white);
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
 
        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
 
        .btn:active {
            transform: translateY(0);
        }
 
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
 
        .btn-secondary {
            background: var(--secondary);
            color: var(--text);
            margin-top: 12px;
        }
 
        .btn-secondary:hover {
            background: var(--border);
        }
 
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-light);
            font-size: 14px;
        }
 
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
 
        .divider span {
            padding: 0 16px;
        }
 
        .tips {
            background: var(--secondary);
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
        }
 
        .tips h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
 
        .tips ul {
            list-style: none;
            font-size: 13px;
            color: var(--text-light);
        }
 
        .tips li {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }
 
        .tips li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: bold;
        }
 
        /* Chat Page Styles */
        .chat-container {
            display: none;
            flex-direction: column;
            height: 600px;
        }
 
        .chat-header {
            background: var(--primary);
            color: var(--white);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
 
        .room-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
 
        .room-code {
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
 
        .room-code:hover {
            background: rgba(255, 255, 255, 0.3);
        }
 
        .online-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }
 
        .online-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
 
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
 
        .leave-btn {
            background: rgba(255, 255, 255, 0.2);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
 
        .leave-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
 
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
 
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            animation: fadeIn 0.3s ease;
        }
 
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
 
        .message.own {
            align-self: flex-end;
            background: var(--primary);
            color: var(--white);
            border-bottom-right-radius: 4px;
        }
 
        .message.other {
            align-self: flex-start;
            background: var(--white);
            color: var(--text);
            border-bottom-left-radius: 4px;
            box-shadow: var(--shadow);
        }
 
        .message-sender {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            opacity: 0.8;
        }
 
        .message-content {
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }
 
        .message-time {
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.7;
            text-align: right;
        }
 
        .system-message {
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
            padding: 8px;
            opacity: 0.8;
        }
 
        .chat-input {
            padding: 16px 20px;
            background: var(--white);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
 
        .chat-input input {
            flex: 1;
            padding: 14px 18px;
            font-size: 15px;
            border: 2px solid var(--border);
            border-radius: 24px;
            outline: none;
            transition: border-color 0.3s;
        }
 
        .chat-input input:focus {
            border-color: var(--primary);
        }
 
        .send-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--primary);
            color: var(--white);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
 
        .send-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }
 
        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
 
        .connection-status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--white);
            padding: 12px 24px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            display: none;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            z-index: 100;
            animation: slideDown 0.3s ease;
        }
 
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
 
        .connection-status.connecting {
            color: #F59E0B;
        }
 
        .connection-status.connected {
            color: var(--accent);
        }
 
        .connection-status.disconnected {
            color: #EF4444;
        }
 
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
 
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
 
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-light);
            text-align: center;
            padding: 40px;
        }
 
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
 
        .empty-state p {
            font-size: 15px;
        }
 
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
 
        .toast.show {
            opacity: 1;
        }
 
        @media (max-width: 640px) {
            body {
                padding: 0;
            }
 
            .container {
                max-width: 100%;
                border-radius: 0;
                min-height: 100vh;
            }
 
            .chat-container {
                height: 100vh;
                height: 100dvh;
            }
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>
    <script>
        const SUPABASE_URL = 'https://fedlhohopipeyrmdctfr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlZGxob2hvcGlwZXlybWRjdGZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTMxMTgsImV4cCI6MjA5NTgyOTExOH0.aQ5h9c11gObhvvCJpehPwRk7tn_7vfjtPMuJz7oXMDI';
        let supabaseClient;
        let currentRoom = null;
        let currentNickname = null;
        let channel = null;
        let messageSubscription = null;
 
        const loginPage = document.getElementById('loginPage');
        const chatPage = document.getElementById('chatPage');
        const connectionStatus = document.getElementById('connectionStatus');
        const toast = document.getElementById('toast');
 
        const nicknameInput = document.getElementById('nickname');
        const roomCodeInput = document.getElementById('roomCode');
        const joinBtn = document.getElementById('joinBtn');
        const createRoomBtn = document.getElementById('createRoomBtn');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const roomCodeText = document.getElementById('roomCodeText');
        const onlineCount = document.getElementById('onlineCount');
        const displayRoomCode = document.getElementById('displayRoomCode');
 
        function initSupabase() {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
 
        function generateRoomCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }
 
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
 
        function showConnectionStatus(status, message) {
            connectionStatus.style.display = 'flex';
            connectionStatus.className = 'connection-status ' + status;
            
            if (status === 'connecting') {
                connectionStatus.innerHTML = '<div class="spinner"></div><span>' + message + '</span>';
            } else if (status === 'connected') {
                connectionStatus.innerHTML = '<span style="color: var(--accent)">✓</span><span>' + message + '</span>';
                setTimeout(() => {
                    connectionStatus.style.display = 'none';
                }, 2000);
            } else if (status === 'disconnected') {
                connectionStatus.innerHTML = '<span style="color: #EF4444">✕</span><span>' + message + '</span>';
            }
        }
 
        function formatTime(date) {
            const hours = date.getHours().toString().padStart(2, '0');
            const minutes = date.getMinutes().toString().padStart(2, '0');
            return hours + ':' + minutes;
        }
 
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
 
        async function createRoom(roomCode) {
            const { error } = await supabaseClient
                .from('rooms')
                .upsert({ 
                    room_id: roomCode,
                    last_activity: new Date().toISOString()
                });
 
            if (error) {
                console.error('创建房间失败:', error);
                return false;
            }
            return true;
        }
 
        async function loadMessages(roomCode) {
            const { data: messages, error } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('room_id', roomCode)
                .order('created_at', { ascending: true })
                .limit(50);
 
            if (error) {
                console.error('加载消息失败:', error);
                return [];
            }
 
            return messages || [];
        }
 
        function renderMessages(messages) {
            if (messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">💬</div>
                        <p>开始发送消息吧！<br>对方加入后即可实时收到消息。</p>
                    </div>
                `;
                return;
            }
 
            messagesContainer.innerHTML = messages.map(msg => {
                const isOwn = msg.sender_nickname === currentNickname;
                const time = new Date(msg.created_at);
                
                return `
                    <div class="message ${isOwn ? 'own' : 'other'}">
                        ${!isOwn ? '<div class="message-sender">' + escapeHtml(msg.sender_nickname) + '</div>' : ''}
                        <div class="message-content">${escapeHtml(msg.content)}</div>
                        <div class="message-time">${formatTime(time)}</div>
                    </div>
                `;
            }).join('');
 
            scrollToBottom();
        }
 
        function addMessage(message) {
            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
 
            const isOwn = message.sender_nickname === currentNickname;
            const time = new Date(message.created_at);
            
            const messageEl = document.createElement('div');
            messageEl.className = 'message ' + (isOwn ? 'own' : 'other');
            messageEl.innerHTML = `
                ${!isOwn ? '<div class="message-sender">' + escapeHtml(message.sender_nickname) + '</div>' : ''}
                <div class="message-content">${escapeHtml(message.content)}</div>
                <div class="message-time">${formatTime(time)}</div>
            `;
            
            messagesContainer.appendChild(messageEl);
            scrollToBottom();
        }
 
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
 
        async function sendMessage(content) {
            if (!content.trim() || !currentRoom) return;
 
            const message = {
                room_id: currentRoom,
                sender_nickname: currentNickname,
                content: content.trim(),
                created_at: new Date().toISOString()
            };
 
            const { error } = await supabaseClient
                .from('messages')
                .insert([message]);
 
            if (error) {
                console.error('发送消息失败:', error);
                showToast('发送失败，请重试');
            }
 
            await supabaseClient
                .from('rooms')
                .update({ last_activity: new Date().toISOString() })
                .eq('room_id', currentRoom);
        }
 
        function subscribeToMessages(roomCode) {
            if (messageSubscription) {
                messageSubscription.unsubscribe();
            }
 
            messageSubscription = supabaseClient
                .channel('room-messages-' + roomCode)
                .on(
                    'postgres_changes',
                    {
                        event: 'INSERT',
                        schema: 'public',
                        table: 'messages',
                        filter: 'room_id=eq.' + roomCode
                    },
                    (payload) => {
                        addMessage(payload.new);
                    }
                )
                .subscribe();
        }
 
        function subscribeToPresence(roomCode) {
            if (channel) {
                channel.unsubscribe();
            }
 
            channel = supabaseClient.channel('room-presence-' + roomCode);
 
            channel
                .on('presence', { event: 'sync' }, () => {
                    const state = channel.presenceState();
                    const count = Object.keys(state).length;
                    onlineCount.textContent = count + ' 人在线';
                })
                .on('presence', { event: 'join' }, ({ newPresences }) => {
                    const name = newPresences[0]?.nickname || '未知用户';
                    addSystemMessage(name + ' 加入了房间');
                    updatePresence();
                })
                .on('presence', { event: 'leave' }, ({ leftPresences }) => {
                    const name = leftPresences[0]?.nickname || '未知用户';
                    addSystemMessage(name + ' 离开了房间');
                    updatePresence();
                })
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await channel.track({
                            nickname: currentNickname,
                            online_at: new Date().toISOString()
                        });
                    }
                });
        }
 
        async function updatePresence() {
            if (channel) {
                await channel.track({
                    nickname: currentNickname,
                    online_at: new Date().toISOString()
                });
            }
        }
 
        function addSystemMessage(message) {
            const emptyState = messagesContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }
 
            const msgEl = document.createElement('div');
            msgEl.className = 'system-message';
            msgEl.textContent = message;
            messagesContainer.appendChild(msgEl);
            scrollToBottom();
        }
 
        async function joinRoom(roomCode, nickname) {
            showConnectionStatus('connecting', '正在连接...');
 
            try {
                const exists = await checkRoomExists(roomCode);
                
                if (!exists) {
                    const created = await createRoom(roomCode);
                    if (!created) {
                        showConnectionStatus('disconnected', '房间创建失败');
                        setTimeout(() => {
                            connectionStatus.style.display = 'none';
                        }, 2000);
                        return false;
                    }
                }
 
                const messages = await loadMessages(roomCode);
                
                currentRoom = roomCode;
                currentNickname = nickname;
 
                loginPage.style.display = 'none';
                chatPage.style.display = 'flex';
                roomCodeText.textContent = roomCode;
 
                renderMessages(messages);
                subscribeToMessages(roomCode);
                subscribeToPresence(roomCode);
 
                showConnectionStatus('connected', '已连接');
                sendBtn.disabled = false;
 
                return true;
 
            } catch (error) {
                console.error('加入房间失败:', error);
                showConnectionStatus('disconnected', '连接失败');
                setTimeout(() => {
                    connectionStatus.style.display = 'none';
                }, 2000);
                return false;
            }
        }
 
        async function checkRoomExists(roomCode) {
            const { data, error } = await supabaseClient
                .from('rooms')
                .select('room_id')
                .eq('room_id', roomCode)
                .single();
 
            return !!data;
        }
 
        function leaveRoom() {
            if (channel) {
                channel.unsubscribe();
                channel = null;
            }
 
            if (messageSubscription) {
                messageSubscription.unsubscribe();
                messageSubscription = null;
            }
 
            currentRoom = null;
            currentNickname = null;
 
            chatPage.style.display = 'none';
            loginPage.style.display = 'block';
            
            messagesContainer.innerHTML = `
                <div class="empty-state">
                    <div class="icon">💬</div>
                    <p>开始发送消息吧！<br>对方加入后即可实时收到消息。</p>
                </div>
            `;
 
            sendBtn.disabled = true;
            connectionStatus.style.display = 'none';
        }
 
        function validateRoomCode(code) {
            return /^\d{6}$/.test(code);
        }
 
        joinBtn.addEventListener('click', async () => {
            const nickname = nicknameInput.value.trim();
            const roomCode = roomCodeInput.value.trim();
 
            if (!nickname) {
                showToast('请输入昵称');
                nicknameInput.focus();
                return;
            }
 
            if (!roomCode) {
                showToast('请输入房间号');
                roomCodeInput.focus();
                return;
            }
 
            if (!validateRoomCode(roomCode)) {
                showToast('房间号必须是6位数字');
                roomCodeInput.focus();
                return;
            }
 
            joinBtn.disabled = true;
            createRoomBtn.disabled = true;
 
            const success = await joinRoom(roomCode, nickname);
 
            joinBtn.disabled = false;
            createRoomBtn.disabled = false;
 
            if (!success) {
                showToast('加入房间失败，请重试');
            }
        });
 
        createRoomBtn.addEventListener('click', async () => {
            const nickname = nicknameInput.value.trim();
 
            if (!nickname) {
                showToast('请输入昵称');
                nicknameInput.focus();
                return;
            }
 
            createRoomBtn.disabled = true;
            joinBtn.disabled = true;
 
            const roomCode = generateRoomCode();
            const success = await joinRoom(roomCode, nickname);
 
            if (success) {
                showToast('房间已创建：' + roomCode);
            } else {
                createRoomBtn.disabled = false;
                joinBtn.disabled = false;
                showToast('创建房间失败，请重试');
            }
        });
 
        messageInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                const content = messageInput.value;
                if (content.trim()) {
                    await sendMessage(content);
                    messageInput.value = '';
                }
            }
        });
 
        sendBtn.addEventListener('click', async () => {
            const content = messageInput.value;
            if (content.trim()) {
                await sendMessage(content);
                messageInput.value = '';
                messageInput.focus();
            }
        });
 
        leaveBtn.addEventListener('click', () => {
            leaveRoom();
        });
 
        displayRoomCode.addEventListener('click', () => {
            navigator.clipboard.writeText(currentRoom).then(() => {
                showToast('房间号已复制到剪贴板');
            }).catch(() => {
                showToast('复制失败，请手动复制');
            });
        });
 
        nicknameInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[<>]/g, '');
        });
 
        roomCodeInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
        });
 
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });
 
        initSupabase();
    <\/script>
</body>
</html>
