<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>中星9C 卫星寻星器</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap');
 
:root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #111827;
    --bg-card: #1a2234;
    --accent-green: #00ff88;
    --accent-gold: #ffd700;
    --accent-red: #ff4757;
    --accent-blue: #00d4ff;
    --text-primary: #ffffff;
    --text-secondary: #a0a0a0;
    --text-dim: #5a6a7a;
    --border-color: #2a3a5a;
}
 
* { margin: 0; padding: 0; box-sizing: border-box; }
 
html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Orbitron', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    user-select: none;
    -webkit-user-select: none;
}
 
.app-container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}
 
.app-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
        radial-gradient(ellipse at 20% 20%, rgba(0, 255, 136, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(0, 212, 255, 0.05) 0%, transparent 50%),
        linear-gradient(180deg, rgba(10, 14, 26, 0) 0%, rgba(0, 0, 0, 0.5) 100%);
    pointer-events: none;
    z-index: 0;
}
 
.header {
    padding: 16px 20px;
    text-align: center;
    background: linear-gradient(180deg, rgba(17, 24, 39, 0.95) 0%, rgba(17, 24, 39, 0) 100%);
    position: relative;
    z-index: 10;
}
 
.satellite-name {
    font-size: 24px;
    font-weight: 800;
    color: var(--accent-gold);
    text-transform: uppercase;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    margin-bottom: 4px;
}
 
.satellite-position {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: 2px;
}
 
.main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    position: relative;
    z-index: 1;
}
 
.compass-container {
    position: relative;
    width: min(85vw, 400px);
    height: min(85vw, 400px);
}
 
#compassCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 
        0 0 60px rgba(0, 255, 136, 0.15),
        0 0 120px rgba(0, 255, 136, 0.05),
        inset 0 0 60px rgba(0, 0, 0, 0.5);
    border: 3px solid var(--border-color);
}
 
.level-container {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    justify-content: center;
}
 
.level-box {
    background: var(--bg-card);
    border-radius: 12px;
    padding: 12px;
    border: 1px solid var(--border-color);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}
 
.level-box h4 {
    font-size: 10px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
    text-align: center;
}
 
.level-canvas {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 2px solid var(--border-color);
}
 
.data-panel {
    background: linear-gradient(180deg, rgba(17, 24, 39, 0) 0%, rgba(17, 24, 39, 0.95) 100%);
    padding: 20px;
    position: relative;
    z-index: 10;
}
 
.data-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    max-width: 500px;
    margin: 0 auto;
}
 
.data-item {
    background: var(--bg-card);
    border-radius: 10px;
    padding: 14px 16px;
    border: 1px solid var(--border-color);
    position: relative;
    overflow: hidden;
}
 
.data-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px;
    height: 100%;
    background: var(--accent-green);
}
 
.data-item.gps::before { background: var(--accent-blue); }
.data-item.azimuth::before { background: var(--accent-gold); }
.data-item.elevation::before { background: var(--accent-green); }
.data-item.polarization::before { background: var(--accent-red); }
 
.data-label {
    font-size: 10px;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
}
 
.data-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
}
 
.data-value.highlight {
    color: var(--accent-green);
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
}
 
.status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-secondary);
    border-radius: 20px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 16px;
}
 
.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent-red);
    animation: pulse 1.5s infinite;
}
 
.status-dot.active { background: var(--accent-green); }
 
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}
 
.permission-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 14, 26, 0.98);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 40px;
    text-align: center;
}
 
.permission-icon {
    font-size: 64px;
    margin-bottom: 24px;
    animation: float 3s ease-in-out infinite;
}
 
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
 
.permission-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--accent-gold);
    margin-bottom: 16px;
}
 
.permission-text {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 300px;
}
 
.permission-btn {
    background: linear-gradient(135deg, var(--accent-green) 0%, #00cc6a 100%);
    color: var(--bg-primary);
    border: none;
    padding: 14px 40px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Orbitron', sans-serif;
    text-transform: uppercase;
    letter-spacing: 2px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
    margin: 8px;
}
 
.permission-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 30px rgba(0, 255, 136, 0.5);
}
 
.permission-btn.secondary {
    background: linear-gradient(135deg, var(--accent-blue) 0%, #0099cc 100%);
    box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
}
 
.permission-btn.secondary:hover {
    box-shadow: 0 6px 30px rgba(0, 212, 255, 0.5);
}
 
.input-group {
    margin: 20px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 280px;
}
 
.input-row {
    display: flex;
    gap: 10px;
}
 
.input-field {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 12px;
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
}
 
.input-field::placeholder {
    color: var(--text-dim);
}
 
.input-field:focus {
    outline: none;
    border-color: var(--accent-green);
}
 
.locked-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 255, 136, 0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    pointer-events: none;
    animation: lockedPulse 1s ease-in-out infinite;
}
 
@keyframes lockedPulse {
    0%, 100% { background: rgba(0, 255, 136, 0.1); }
    50% { background: rgba(0, 255, 136, 0.2); }
}
 
.locked-text {
    font-size: 32px;
    font-weight: 800;
    color: var(--accent-green);
    text-transform: uppercase;
    letter-spacing: 8px;
    text-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
    animation: lockedText 0.5s ease-in-out infinite;
}
 
@keyframes lockedText {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
}
 
.simulated-controls {
    position: absolute;
    top: 70px;
    right: 10px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 10px;
    z-index: 50;
}
 
.sim-controls-title {
    font-size: 10px;
    color: var(--accent-blue);
    text-transform: uppercase;
    margin-bottom: 8px;
    text-align: center;
}
 
.sim-slider {
    width: 100px;
    -webkit-appearance: none;
    background: var(--bg-secondary);
    border-radius: 5px;
    height: 6px;
    margin: 5px 0;
}
 
.sim-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    background: var(--accent-green);
    border-radius: 50%;
    cursor: pointer;
}
 
@media (orientation: landscape) and (max-height: 500px) {
    .main-content { flex-direction: row; gap: 20px; }
    .level-container { flex-direction: column; margin-top: 0; }
    .data-grid { grid-template-columns: repeat(4, 1fr); }
}
 
@media (min-width: 768px) {
    .compass-container { width: 450px; height: 450px; }
    .level-canvas { width: 120px; height: 120px; }
    .data-value { font-size: 22px; }
}
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1 class="satellite-name">中星9C</h1>
            <p class="satellite-position">92.2°E | 中国直播卫星</p>
            <button id="downloadBtn" style="position: absolute; top: 10px; right: 10px; padding: 6px 12px; font-size: 10px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 4px; color: var(--text-secondary); cursor: pointer;">下载</button>
        </div>
 
        <div class="main-content">
            <div class="compass-container">
                <canvas id="compassCanvas"></canvas>
            </div>
 
            <div class="level-container">
                <div class="level-box">
                    <h4>俯仰</h4>
                    <canvas id="levelPitch"></canvas>
                </div>
                <div class="level-box">
                    <h4>横滚</h4>
                    <canvas id="levelRoll"></canvas>
                </div>
            </div>
 
            <div class="simulated-controls" id="simControls" style="display: none;">
                <div class="sim-controls-title">模拟朝向</div>
                <input type="range" class="sim-slider" id="simHeading" min="0" max="360" value="0">
            </div>
        </div>
 
        <div class="data-panel">
            <div class="data-grid">
                <div class="data-item gps">
                    <div class="data-label"><span>📍</span> GPS位置</div>
                    <div class="data-value" id="gpsValue">等待定位...</div>
                </div>
                <div class="data-item azimuth">
                    <div class="data-label"><span>🧭</span> 目标方位</div>
                    <div class="data-value highlight" id="azimuthValue">--°</div>
                </div>
                <div class="data-item elevation">
                    <div class="data-label"><span>📐</span> 仰角</div>
                    <div class="data-value" id="elevationValue">--°</div>
                </div>
                <div class="data-item polarization">
                    <div class="data-label"><span>📡</span> 极化角</div>
                    <div class="data-value" id="polarizationValue">--°</div>
                </div>
            </div>
            
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">正在初始化...</span>
            </div>
        </div>
 
        <div class="permission-overlay" id="permissionOverlay">
            <div class="permission-icon">📡</div>
            <h2 class="permission-title">中星9C 寻星器</h2>
            <p class="permission-text" id="permissionMessage">
                此应用需要访问您的GPS和传感器来计算卫星方位。
            </p>
            
            <div class="input-group" id="manualInput" style="display: none;">
                <div class="input-row">
                    <input type="text" class="input-field" id="inputLat" placeholder="纬度 如: 39.9042">
                    <input type="text" class="input-field" id="inputLon" placeholder="经度 如: 116.4074">
                </div>
                <button class="permission-btn secondary" id="submitCoords" style="margin: 0;">确认坐标</button>
            </div>
            
            <button class="permission-btn" id="permissionBtn">授予权限</button>
            <button class="permission-btn secondary" id="manualBtn" style="display: none;">手动输入坐标</button>
        </div>
 
        <div class="locked-overlay" id="lockedOverlay" style="display: none;">
            <div class="locked-text">对准成功!</div>
        </div>
    </div>
 
    <script>
const SensorManager = {
    position: null,
    orientation: null,
    isSimulated: false,
    listeners: { orientation: [], position: [] },
    
    async init() {
        await this.requestPermissions();
    },
    
    async requestPermissions() {
        if (typeof DeviceOrientationEvent !== 'undefined' && 
            typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const perm = await DeviceOrientationEvent.requestPermission();
                if (perm === 'granted') {
                    this.initDeviceOrientation();
                    return true;
                }
            } catch (e) {}
        }
        
        if ('DeviceOrientationEvent' in window) {
            this.initDeviceOrientation();
            return true;
        }
        
        return false;
    },
    
    initGeolocation() {
        if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    this.position = {
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude
                    };
                    this.notifyListeners('position', this.position);
                },
                (err) => console.warn('GPS错误:', err.message),
                { enableHighAccuracy: true, timeout: 10000 }
            );
            
            navigator.geolocation.watchPosition(
                (pos) => {
                    this.position = {
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude
                    };
                    this.notifyListeners('position', this.position);
                },
                () => {},
                { enableHighAccuracy: true }
            );
        }
    },
    
    initDeviceOrientation() {
        window.addEventListener('deviceorientation', (e) => {
            if (e.alpha !== null) {
                this.orientation = {
                    alpha: e.alpha || 0,
                    beta: e.beta || 0,
                    gamma: e.gamma || 0,
                    heading: ((360 - e.alpha) % 360)
                };
                this.notifyListeners('orientation', this.orientation);
            }
        }, true);
    },
    
    setSimulatedPosition(lat, lon) {
        this.position = { latitude: lat, longitude: lon };
        this.notifyListeners('position', this.position);
    },
    
    setSimulatedHeading(heading) {
        this.orientation = { heading: heading, alpha: 360 - heading, beta: 0, gamma: 0 };
        this.notifyListeners('orientation', this.orientation);
    },
    
    enableSimulation() {
        this.isSimulated = true;
    },
    
    onOrientationChange(callback) {
        if (typeof callback === 'function') this.listeners.orientation.push(callback);
    },
    
    onPositionChange(callback) {
        if (typeof callback === 'function') this.listeners.position.push(callback);
    },
    
    notifyListeners(type, data) {
        if (this.listeners[type]) {
            this.listeners[type].forEach(cb => { try { cb(data); } catch (e) {} });
        }
    }
};
 
const SatelliteCalculator = {
    satellite: { name: '中星9C', longitude: 92.2 },
    declination: -7,
    
    calculateSimple(userLat, userLon) {
        if (userLat === null || userLon === null) return null;
        
        const latRad = this.toRadians(userLat);
        const deltaLon = this.satellite.longitude - userLon;
        const deltaLonRad = this.toRadians(deltaLon);
        
        const cosLat = Math.cos(latRad);
        const sinLat = Math.sin(latRad);
        const cosDelta = Math.cos(deltaLonRad);
        const sinDelta = Math.sin(deltaLonRad);
        
        const elevation = Math.atan2(
            cosLat * cosDelta - 0.15126,
            Math.sqrt(1 - cosLat * cosLat * sinDelta * sinDelta)
        );
        
        const azimuth = Math.atan2(
            sinDelta,
            Math.tan(latRad) * cosDelta - sinLat * 0.9682
        );
        
        const azimuthCompass = this.normalizeAngle(this.toDegrees(azimuth) - this.declination);
        
        return {
            azimuthCompass: azimuthCompass,
            elevation: this.toDegrees(elevation),
            polarization: deltaLon * Math.cos(latRad) * 0.986,
            targetAzimuth: azimuthCompass
        };
    },
    
    toRadians(deg) { return deg * Math.PI / 180; },
    toDegrees(rad) { return rad * 180 / Math.PI; },
    normalizeAngle(a) { return ((a % 360) + 360) % 360; }
};
 
class CompassRenderer {
    constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.locked = false;
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }
    
    resize() {
        const size = Math.min(this.canvas.parentElement.clientWidth, this.canvas.parentElement.clientHeight);
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = size * dpr;
        this.canvas.height = size * dpr;
        this.canvas.style.width = `${size}px`;
        this.canvas.style.height = `${size}px`;
        this.ctx.scale(dpr, dpr);
        this.size = size;
        this.center = size / 2;
        this.radius = size / 2 - 10;
    }
    
    render(heading, targetAzimuth, elevation) {
        this.ctx.clearRect(0, 0, this.size, this.size);
        
        const grad = this.ctx.createRadialGradient(this.center, this.center, 0, this.center, this.center, this.radius);
        grad.addColorStop(0, '#0f1520');
        grad.addColorStop(1, '#050810');
        this.ctx.beginPath();
        this.ctx.arc(this.center, this.center, this.radius, 0, Math.PI * 2);
        this.ctx.fillStyle = grad;
        this.ctx.fill();
        
        for (let i = 0; i < 3; i++) {
            this.ctx.beginPath();
            this.ctx.arc(this.center, this.center, this.radius - i * (this.radius * 0.15), 0, Math.PI * 2);
            this.ctx.strokeStyle = '#2a3a5a';
            this.ctx.lineWidth = 2;
            this.ctx.stroke();
        }
        
        for (let i = 0; i < 360; i++) {
            const angle = -Math.PI / 2 + (i - heading) * Math.PI / 180;
            const isMajor = i % 30 === 0;
            const isMedium = i % 10 === 0 && !isMajor;
            const isMinor = i % 5 === 0 && !isMajor && !isMedium;
            
            let len = 0, lw = 1, col = '#5a6a7a';
            if (isMajor) { len = this.radius * 0.12; lw = 3; col = '#fff'; }
            else if (isMedium) { len = this.radius * 0.08; lw = 2; col = '#a0a0a0'; }
            else if (isMinor) { len = this.radius * 0.04; }
            
            if (len > 0) {
                this.ctx.beginPath();
                this.ctx.moveTo(this.center + Math.cos(angle) * (this.radius - 5), this.center + Math.sin(angle) * (this.radius - 5));
                this.ctx.lineTo(this.center + Math.cos(angle) * (this.radius - 5 - len), this.center + Math.sin(angle) * (this.radius - 5 - len));
                this.ctx.strokeStyle = col;
                this.ctx.lineWidth = lw;
                this.ctx.stroke();
            }
        }
        
        const labels = [['N', 0], ['E', 90], ['S', 180], ['W', 270]];
        this.ctx.font = `bold ${this.size * 0.05}px Orbitron`;
        this.ctx.textAlign = 'center';
        this.ctx.textBaseline = 'middle';
        labels.forEach(([l, a], i) => {
            const rad = -Math.PI / 2 + (a - heading) * Math.PI / 180;
            this.ctx.fillStyle = i === 0 ? '#ff4757' : '#fff';
            this.ctx.fillText(l, this.center + Math.cos(rad) * this.radius * 0.75, this.center + Math.sin(rad) * this.radius * 0.75);
        });
        
        const targetRad = -Math.PI / 2 + (targetAzimuth - heading) * Math.PI / 180;
        const mx = this.center + Math.cos(targetRad) * this.radius * 0.5;
        const my = this.center + Math.sin(targetRad) * this.radius * 0.5;
        
        this.ctx.save();
        this.ctx.translate(mx, my);
        this.ctx.rotate(targetRad + Math.PI / 2);
        this.ctx.beginPath();
        this.ctx.moveTo(0, -this.size * 0.04);
        this.ctx.lineTo(this.size * 0.025, this.size * 0.03);
        this.ctx.lineTo(-this.size * 0.025, this.size * 0.03);
        this.ctx.closePath();
        this.ctx.fillStyle = this.locked ? '#00ff00' : '#00ff88';
        this.ctx.shadowColor = '#00ff88';
        this.ctx.shadowBlur = 15;
        this.ctx.fill();
        this.ctx.restore();
        
        this.ctx.font = `${this.size * 0.03}px Orbitron`;
        this.ctx.fillStyle = '#00ff88';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('SAT', mx, my + this.size * 0.08);
        
        let diff = targetAzimuth - heading;
        while (diff > 180) diff -= 360;
        while (diff < -180) diff += 360;
        const deviation = Math.abs(diff);
        
        let centerColor = '#ff4757';
        if (deviation < 3) { centerColor = '#00ff88'; this.locked = true; }
        else if (deviation < 10) { centerColor = '#ffd700'; this.locked = false; }
        else this.locked = false;
        
        this.ctx.beginPath();
        this.ctx.arc(this.center, this.center, this.size * 0.08, 0, Math.PI * 2);
        this.ctx.fillStyle = centerColor;
        this.ctx.shadowColor = centerColor;
        this.ctx.shadowBlur = 20;
        this.ctx.fill();
        this.ctx.shadowBlur = 0;
        
        if (elevation !== undefined) {
            this.ctx.font = `${this.size * 0.035}px JetBrains Mono`;
            this.ctx.fillStyle = '#fff';
            this.ctx.fillText(`${elevation.toFixed(1)}°`, this.center, this.center);
        }
    }
}
 
class LevelRenderer {
    constructor(canvasX, canvasY) {
        this.canvasX = canvasX;
        this.canvasY = canvasY;
        this.ctxX = canvasX.getContext('2d');
        this.ctxY = canvasY.getContext('2d');
        this.resize();
    }
    
    resize() {
        const size = 100;
        const dpr = window.devicePixelRatio || 1;
        [this.canvasX, this.canvasY].forEach(c => {
            c.width = size * dpr;
            c.height = size * dpr;
            c.style.width = `${size}px`;
            c.style.height = `${size}px`;
        });
        this.ctxX.scale(dpr, dpr);
        this.ctxY.scale(dpr, dpr);
        this.size = size;
        this.center = size / 2;
    }
    
    render(pitch, roll) {
        this.drawLevel(this.ctxX, roll, '横滚');
        this.drawLevel(this.ctxY, pitch, '俯仰');
    }
    
    drawLevel(ctx, value, label) {
        ctx.clearRect(0, 0, this.size, this.size);
        const r = this.size / 2 - 5;
        
        const grad = ctx.createRadialGradient(this.center, this.center, 0, this.center, this.center, r);
        grad.addColorStop(0, '#0f1520');
        grad.addColorStop(1, '#0a0e1a');
        ctx.beginPath();
        ctx.arc(this.center, this.center, r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = '#2a3a5a';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        const maxOffset = r * 0.8;
        const offset = Math.max(-45, Math.min(45, value)) / 45 * maxOffset;
        const dist = Math.abs(offset);
        
        let col = '#ff4757';
        if (dist < maxOffset * 0.15) col = '#00ff88';
        else if (dist < maxOffset * 0.4) col = '#ffd700';
        
        ctx.beginPath();
        ctx.arc(this.center + offset, this.center, r * 0.2, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.shadowColor = col;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.font = `bold ${this.size * 0.12}px JetBrains Mono`;
        ctx.fillStyle = '#a0a0a0';
        ctx.textAlign = 'center';
        ctx.fillText(`${value.toFixed(1)}°`, this.center, this.center - r * 0.6);
    }
}
 
class SatelliteTracker {
    constructor() {
        this.compass = null;
        this.level = null;
        this.satelliteData = null;
        this.currentPosition = null;
        this.currentHeading = 0;
        this.isLocked = false;
        this.isSimulated = false;
        
        this.init();
    }
    
    init() {
        this.setupUI();
        this.compass = new CompassRenderer(document.getElementById('compassCanvas'));
        this.level = new LevelRenderer(document.getElementById('levelPitch'), document.getElementById('levelRoll'));
        this.setupEventListeners();
        this.autoSetup();
    }
    
    setupUI() {
        this.el = {
            permissionOverlay: document.getElementById('permissionOverlay'),
            permissionBtn: document.getElementById('permissionBtn'),
            manualBtn: document.getElementById('manualBtn'),
            manualInput: document.getElementById('manualInput'),
            inputLat: document.getElementById('inputLat'),
            inputLon: document.getElementById('inputLon'),
            permissionMessage: document.getElementById('permissionMessage'),
            gpsValue: document.getElementById('gpsValue'),
            azimuthValue: document.getElementById('azimuthValue'),
            elevationValue: document.getElementById('elevationValue'),
            polarizationValue: document.getElementById('polarizationValue'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            lockedOverlay: document.getElementById('lockedOverlay'),
            simControls: document.getElementById('simControls'),
            simHeading: document.getElementById('simHeading')
        };
    }
    
    setupEventListeners() {
        this.el.permissionBtn.addEventListener('click', () => this.requestSensorPermission());
        this.el.manualBtn.addEventListener('click', () => this.toggleManualInput());
        document.getElementById('submitCoords').addEventListener('click', () => this.submitManualCoords());
        this.el.simHeading.addEventListener('input', (e) => {
            if (this.isSimulated) {
                SensorManager.setSimulatedHeading(parseFloat(e.target.value));
            }
        });
        
        // 下载按钮功能
        document.getElementById('downloadBtn').addEventListener('click', () => {
            this.downloadFile();
        });
    }
    
    downloadFile() {
        const htmlContent = document.documentElement.outerHTML;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'satellite-tracker.html';
        a.click();
        URL.revokeObjectURL(url);
    }
    
    async autoSetup() {
        this.el.permissionMessage.textContent = '正在检测设备传感器...';
        
        await new Promise(r => setTimeout(r, 500));
        
        const hasOrientation = 'DeviceOrientationEvent' in window;
        const hasGeolocation = 'geolocation' in navigator;
        
        if (hasOrientation) {
            this.el.permissionMessage.textContent = '检测到方向传感器可用。点击"授予权限"继续。';
            this.el.manualBtn.style.display = 'none';
        } else {
            this.el.permissionMessage.textContent = '此设备不支持方向传感器。\n可使用手动输入坐标+滑块模拟。';
            this.el.permissionBtn.style.display = 'none';
            this.el.manualBtn.style.display = 'inline-block';
            this.el.manualInput.style.display = 'flex';
            SensorManager.enableSimulation();
            this.isSimulated = true;
        }
    }
    
    async requestSensorPermission() {
        SensorManager.enableSimulation();
        this.isSimulated = true;
        
        try {
            await SensorManager.init();
            SensorManager.initGeolocation();
        } catch (e) {
            console.warn('传感器初始化失败，使用模拟模式');
        }
        
        if (SensorManager.position) {
            this.currentPosition = SensorManager.position;
            this.updateGPSDisplay();
        } else {
            const defaultLat = 39.9042;
            const defaultLon = 116.4074;
            SensorManager.setSimulatedPosition(defaultLat, defaultLon);
            this.currentPosition = { latitude: defaultLat, longitude: defaultLon };
            this.updateGPSDisplay();
        }
        
        SensorManager.onOrientationChange((data) => {
            if (this.isSimulated) {
                this.currentHeading = data.heading;
            }
        });
        
        SensorManager.onPositionChange((data) => {
            this.currentPosition = data;
            this.updateGPSDisplay();
        });
        
        this.el.simControls.style.display = 'block';
        this.el.permissionOverlay.style.display = 'none';
        this.updateStatus('模拟模式运行中', true);
        this.startTracking();
    }
    
    toggleManualInput() {
        const isVisible = this.el.manualInput.style.display !== 'none';
        this.el.manualInput.style.display = isVisible ? 'none' : 'flex';
        this.el.manualBtn.textContent = isVisible ? '手动输入坐标' : '收起输入';
    }
    
    submitManualCoords() {
        const lat = parseFloat(this.el.inputLat.value);
        const lon = parseFloat(this.el.inputLon.value);
        
        if (isNaN(lat) || isNaN(lon) || lat < -90 || lat > 90 || lon < -180 || lon > 180) {
            alert('请输入有效的经纬度坐标！\n纬度: -90 到 90\n经度: -180 到 180');
            return;
        }
        
        SensorManager.enableSimulation();
        this.isSimulated = true;
        SensorManager.setSimulatedPosition(lat, lon);
        this.currentPosition = { latitude: lat, longitude: lon };
        this.updateGPSDisplay();
        
        SensorManager.onOrientationChange((data) => {
            this.currentHeading = data.heading;
        });
        
        this.el.simControls.style.display = 'block';
        this.el.permissionOverlay.style.display = 'none';
        this.updateStatus('手动模式已激活', true);
        this.startTracking();
    }
    
    startTracking() {
        this.update();
    }
    
    update() {
        if (this.currentPosition) {
            this.satelliteData = SatelliteCalculator.calculateSimple(
                this.currentPosition.latitude,
                this.currentPosition.longitude
            );
            
            if (this.satelliteData) {
                this.compass.render(
                    this.currentHeading,
                    this.satelliteData.targetAzimuth,
                    this.satelliteData.elevation
                );
                this.updateDataDisplay();
                this.checkLock();
            }
            
            this.level.render(0, 0);
        }
        
        requestAnimationFrame(() => this.update());
    }
    
    updateGPSDisplay() {
        if (this.currentPosition) {
            this.el.gpsValue.textContent = 
                `${this.currentPosition.latitude.toFixed(4)}°, ${this.currentPosition.longitude.toFixed(4)}°`;
        }
    }
    
    updateDataDisplay() {
        if (!this.satelliteData) return;
        this.el.azimuthValue.textContent = `${this.satelliteData.azimuthCompass.toFixed(1)}°`;
        this.el.elevationValue.textContent = `${this.satelliteData.elevation.toFixed(1)}°`;
        this.el.polarizationValue.textContent = `${this.satelliteData.polarization.toFixed(1)}°`;
    }
    
    checkLock() {
        if (!this.satelliteData) return;
        let diff = this.satelliteData.targetAzimuth - this.currentHeading;
        while (diff > 180) diff -= 360;
        while (diff < -180) diff += 360;
        
        const isAligned = Math.abs(diff) < 5;
        
        if (isAligned && !this.isLocked) {
            this.isLocked = true;
            this.el.lockedOverlay.style.display = 'flex';
            if (navigator.vibrate) navigator.vibrate(200);
        } else if (!isAligned && this.isLocked) {
            this.isLocked = false;
            this.el.lockedOverlay.style.display = 'none';
        }
    }
    
    updateStatus(msg, active) {
        this.el.statusText.textContent = msg;
        this.el.statusDot.classList.toggle('active', active);
    }
}
 
const app = new SatelliteTracker();
