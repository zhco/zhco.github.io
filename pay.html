<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>收款记录看板</title>
    <!-- 引入 Tailwind CSS (开发环境可用 CDN，生产环境建议本地构建) -->
    <script src="https://cdn.tailwindcss.com";></script>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";></script>
    <style>
        /* 自定义滚动条样式 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 font-sans text-gray-800">

    <div class="max-w-6xl mx-auto">
        <!-- 头部标题 -->
        <header class="mb-8 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-gray-900">💰 收款记录看板</h1>
                <p class="text-gray-500 mt-2">实时同步 Supabase 数据库数据</p>
            </div>
            <button onclick="fetchPayments()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg shadow transition flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg"; class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                </svg>
                刷新数据
            </button>
        </header>

        <!-- 状态提示区 -->
        <div id="status-area" class="hidden mb-6 p-4 rounded-lg bg-yellow-50 text-yellow-700 border border-yellow-200">
            正在加载数据...
        </div>

        <!-- 数据表格容器 -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm uppercase tracking-wider">
                            <th class="p-4 font-semibold border-b">时间</th>
                            <th class="p-4 font-semibold border-b">平台</th>
                            <th class="p-4 font-semibold border-b">金额 (元)</th>
                            <th class="p-4 font-semibold border-b">原始消息</th>
                            <th class="p-4 font-semibold border-b">ID</th>
                        </tr>
                    </thead>
                    <tbody id="payment-table-body" class="divide-y divide-gray-100 text-sm">
                        <!-- 数据行将通过 JS 动态插入 -->
                        <tr>
                            <td colspan="5" class="p-8 text-center text-gray-400">点击“刷新数据”加载记录</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- 底部统计 (可选) -->
        <div class="mt-6 text-right text-gray-500 text-xs">
            数据来源：Supabase PostgreSQL
        </div>
    </div>

    <!-- 核心逻辑脚本 -->
    <script>
        // 1. 配置 Supabase 客户端
        // 请确保这里的 URL 和 KEY 与你数据库的一致
        const SUPABASE_URL = 'https://fedlhohopipeyrmdctfr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZlZGxob2hvcGlwZXlybWRjdGZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTMxMTgsImV4cCI6MjA5NTgyOTExOH0.aQ5h9c11gObhvvCJpehPwRk7tn_7vfjtPMuJz7oXMDI';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 2. 定义全局获取数据函数 (解决 ReferenceError: fetchPayments is not defined)
        // 将函数挂载到 window 对象，确保 HTML onclick 能访问到
        window.fetchPayments = async function() {
            const statusArea = document.getElementById('status-area');
            const tableBody = document.getElementById('payment-table-body');
            
            // 显示加载状态
            statusArea.classList.remove('hidden');
            statusArea.textContent = '正在从数据库拉取最新数据...';
            statusArea.className = 'mb-6 p-4 rounded-lg bg-blue-50 text-blue-700 border border-blue-200 animate-pulse';

            try {
                // 执行查询：选择所有列，按时间倒序排列
                const { data, error } = await supabase
                    .from('payments')
                    .select('*')
                    .order('transaction_time', { ascending: false });

                if (error) {
                    throw error;
                }

                // 渲染数据
                renderTable(data);
                
                // 更新状态为成功
                statusArea.textContent = `成功加载 ${data.length} 条记录`;
                statusArea.className = 'mb-6 p-4 rounded-lg bg-green-50 text-green-700 border border-green-200';
                
                // 3 秒后自动隐藏成功提示
                setTimeout(() => {
                    statusArea.classList.add('hidden');
                }, 3000);

            } catch (err) {
                console.error('获取数据失败:', err);
                statusArea.textContent = '加载失败：' + err.message;
                statusArea.className = 'mb-6 p-4 rounded-lg bg-red-50 text-red-700 border border-red-200';
                
                // 出错时清空表格或显示错误行
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-8 text-center text-red-500">
                            数据加载出错，请检查控制台详情或数据库连接。<br>
                            <span class="text-xs opacity-75">${err.message}</span>
                        </td>
                    </tr>
                `;
            }
        };

        // 3. 渲染表格辅助函数
        function renderTable(payments) {
            const tableBody = document.getElementById('payment-table-body');
            
            if (!payments || payments.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-gray-400">暂无数据</td></tr>';
                return;
            }

            let html = '';
            payments.forEach(item => {
                // 格式化时间 (如果数据库存的是字符串可直接用，如果是时间戳需转换)
                const timeStr = item.transaction_time ? new Date(item.transaction_time).toLocaleString('zh-CN') : '-';
                const amountStr = item.amount ? parseFloat(item.amount).toFixed(2) : '0.00';
                const platformStr = item.platform || '未知平台';
                const rawMsg = item.message_raw ? item.message_raw.substring(0, 50) + '...' : '-';
                const idStr = item.id || '-';

                html += `
                    <tr class="hover:bg-gray-50 transition">
                        <td class="p-4 whitespace-nowrap text-gray-600">${timeStr}</td>
                        <td class="p-4 whitespace-nowrap">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full 
                                ${platformStr.includes('微信') ? 'bg-green-100 text-green-700' : 
                                  platformStr.includes('支付宝') ? 'bg-blue-100 text-blue-700' : 
                                  'bg-gray-100 text-gray-600'}">
                                ${platformStr}
                            </span>
                        </td>
                        <td class="p-4 whitespace-nowrap font-mono font-medium text-gray-900">¥ ${amountStr}</td>
                        <td class="p-4 text-gray-500 max-w-xs truncate" title="${item.message_raw || ''}">${rawMsg}</td>
                        <td class="p-4 text-gray-400 text-xs font-mono">${idStr}</td>
                    </tr>
                `;
            });
            tableBody.innerHTML = html;
        }

        // 4. 页面加载完成后自动执行一次
        document.addEventListener('DOMContentLoaded', () => {
            // 延迟一点执行，确保 DOM 完全就绪
            setTimeout(() => {
                window.fetchPayments();
            }, 500);
        });
    </script>
</body>
</html>
